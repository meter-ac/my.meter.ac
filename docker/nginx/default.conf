map "$status:$uri" $cache_control {
    default                         "no-cache";
    ~^2[0-9][0-9]:/healthz$        "no-store";
    ~^2[0-9][0-9]:/assets/.+       "public, max-age=31536000, immutable";
    ~^304:/assets/.+               "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/geo+json
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://meter.ac https://tile.openstreetmap.org; connect-src https://meter.ac https://meter.uni-plovdiv.net; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /assets/ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
