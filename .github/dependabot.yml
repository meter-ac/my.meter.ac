version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    assignees:
      - kerberizer

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    assignees:
      - kerberizer

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    assignees:
      - kerberizer
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
