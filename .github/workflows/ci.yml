name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_PLATFORM: linux/amd64
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
  OCI_METADATA: |
    org.opencontainers.image.title=my.meter.ac
    org.opencontainers.image.description=Map-first web frontend for the METER.AC atmospheric monitoring network
    org.opencontainers.image.url=https://my.meter.ac/
    org.opencontainers.image.source=https://github.com/${{ github.repository }}
    org.opencontainers.image.vendor=METER.AC
    org.opencontainers.image.licenses=Apache-2.0

jobs:
  playwright:
    name: Playwright
    concurrency:
      group: validation-playwright-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Node.js version
        id: node-version
        shell: bash
        run: printf 'version=%s\n' "$(scripts/ci/read-node-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    concurrency:
      group: validation-dependency-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: true
          allow-licenses: >-
            Apache-2.0, BSD-2-Clause, BSD-3-Clause, Hippocratic-2.1, ISC, MIT,
            MPL-2.0

  container:
    name: Container
    concurrency:
      group: validation-container-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell helpers
        run: shellcheck scripts/ci/*.sh

      - name: Check container policy
        run: |
          scripts/ci/read-node-version.sh
          scripts/ci/check-runtime-notices.sh
          docker build --check .

      - name: Build image
        run: docker build --platform "$IMAGE_PLATFORM" --tag my-meter-ac:ci .

      - name: Validate runtime
        run: scripts/ci/validate-container.sh my-meter-ac:ci "$IMAGE_PLATFORM"

  preview-image:
    name: Preview image
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs:
      - playwright
      - dependency-review
      - container
    concurrency:
      group: pr-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Publish previews only for trusted same-repository pull requests.
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Confirm pull request remains open
        id: pull-request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          if [ "$state" = open ]; then
            printf 'open=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'open=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.pull-request.outputs.open == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: ${{ steps.pull-request.outputs.open == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing commit-addressed preview
        if: ${{ steps.pull-request.outputs.open == 'true' }}
        id: existing
        shell: bash
        env:
          IMMUTABLE_TAG: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if digest=$(scripts/ci/find-existing-image.sh \
            "$IMMUTABLE_TAG" "$GITHUB_SHA" "$IMAGE_PLATFORM" 1); then
            printf 'found=true\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 3 ]; then
              exit "$result"
            fi
            printf 'found=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        if: ${{ steps.pull-request.outputs.open == 'true' }}
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-sha-${{ github.sha }}
          labels: ${{ env.OCI_METADATA }}
          annotations: ${{ env.OCI_METADATA }}

      - name: Build and publish preview image
        if: >-
          steps.pull-request.outputs.open == 'true' &&
          steps.existing.outputs.found != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORM }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}

      - name: Publish preview tags
        if: ${{ steps.pull-request.outputs.open == 'true' }}
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          FOUND: ${{ steps.existing.outputs.found }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_TAG: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-sha-${{ github.sha }}
          MUTABLE_TAG: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          digest=${EXISTING_DIGEST:-$BUILT_DIGEST}
          test -n "$digest"
          read -r pr_state current_head_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.state, .head.sha] | @tsv'
          )

          tags=()
          if [ "$FOUND" != true ]; then
            if immutable_digest=$(scripts/ci/find-existing-image.sh \
              "$IMMUTABLE_TAG" "$GITHUB_SHA" "$IMAGE_PLATFORM"); then
              if [ "$immutable_digest" != "$digest" ]; then
                printf 'Refusing to replace %s at conflicting digest %s.\n' \
                  "$IMMUTABLE_TAG" "$immutable_digest" >&2
                exit 1
              fi
            else
              result=$?
              if [ "$result" -ne 3 ]; then
                exit "$result"
              fi
              tags+=(--tag "$IMMUTABLE_TAG")
            fi
          fi
          if [ "$pr_state" != open ]; then
            printf 'Pull request is no longer open; mutable preview tag not updated.\n'
          elif [ "$current_head_sha" != "$TESTED_HEAD_SHA" ]; then
            printf 'Pull request head advanced; mutable preview tag not updated.\n'
          else
            tags+=(--tag "$MUTABLE_TAG")
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            printf 'No preview tags need updating.\n'
            exit 0
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE_NAME@$digest"

  production-image:
    name: Production image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs:
      - playwright
      - container
    concurrency:
      group: production-image
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # Publish production tags to the repository's GHCR package.
      id-token: write # Request a GitHub OIDC identity for keyless Cosign signing.
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing commit-addressed production image
        id: existing
        shell: bash
        env:
          IMMUTABLE_TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if digest=$(scripts/ci/find-existing-image.sh \
            "$IMMUTABLE_TAG" "$GITHUB_SHA" "$IMAGE_PLATFORM" 1); then
            printf 'found=true\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 3 ]; then
              exit "$result"
            fi
            printf 'found=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=sha-${{ github.sha }}
          labels: ${{ env.OCI_METADATA }}
          annotations: ${{ env.OCI_METADATA }}

      - name: Build and publish production image
        if: ${{ steps.existing.outputs.found != 'true' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORM }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify production digest
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          FOUND: ${{ steps.existing.outputs.found }}
        run: |
          set -euo pipefail
          digest=${EXISTING_DIGEST:-$BUILT_DIGEST}
          test -n "$digest"
          if [ "$FOUND" != true ]; then
            cosign sign --yes "$IMAGE_NAME@$digest"
          fi
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_NAME@$digest"

      - name: Publish production tags for the verified digest
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          FOUND: ${{ steps.existing.outputs.found }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          digest=${EXISTING_DIGEST:-$BUILT_DIGEST}
          test -n "$digest"
          current_master_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
            --jq .object.sha)

          tags=()
          if [ "$FOUND" != true ]; then
            if immutable_digest=$(scripts/ci/find-existing-image.sh \
              "$IMMUTABLE_TAG" "$GITHUB_SHA" "$IMAGE_PLATFORM"); then
              if [ "$immutable_digest" != "$digest" ]; then
                printf 'Refusing to replace %s at conflicting digest %s.\n' \
                  "$IMMUTABLE_TAG" "$immutable_digest" >&2
                exit 1
              fi
            else
              result=$?
              if [ "$result" -ne 3 ]; then
                exit "$result"
              fi
              tags+=(--tag "$IMMUTABLE_TAG")
            fi
          fi
          if [ "$current_master_sha" = "$GITHUB_SHA" ]; then
            tags+=(--tag "$IMAGE_NAME:latest")
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            printf 'Production revision is no longer current; no tags need updating.\n'
            exit 0
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE_NAME@$digest"
